<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการการจองห้องพัก - ภูเวียงแกรนด์โฮเต็ล</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            max-width: 1350px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        header p {
            font-size: 16px;
            opacity: 0.9;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
            border-left: 5px solid var(--secondary);
        }
        .card.warning { border-left-color: var(--accent); }
        .card.danger { border-left-color: #ef4444; }
        .card.success { border-left-color: #22c55e; }
        .card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 5px;
        }
        .card .value {
            font-size: 22px;
            font-weight: 700;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 440px 1fr;
            gap: 20px;
        }
        @media (max-width: 1000px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }
        .panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .date-select-group {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1.2fr;
            gap: 5px;
        }
        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .btn-cancel {
            background-color: #64748b;
            display: none;
            margin-top: 5px;
        }
        .btn-cancel:hover {
            background-color: #475569;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }
        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.available { background-color: #dcfce7; color: #15803d; }
        .badge.full { background-color: #fee2e2; color: #b91c1c; }
        .badge.paid { background-color: #dcfce7; color: #15803d; }
        .badge.deposit { background-color: #e0f2fe; color: #0369a1; }
        .badge.unpaid { background-color: #fef3c7; color: #d97706; }
        .action-btns {
            display: flex;
            gap: 8px;
        }
        .edit-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary);
            font-size: 13px;
            font-weight: 600;
        }
        .edit-btn:hover { text-decoration: underline; }
        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #ef4444;
            font-size: 13px;
            font-weight: 600;
        }
        .delete-btn:hover { text-decoration: underline; }
        .contact-link {
            color: #2563eb;
            text-decoration: none;
            display: inline-block;
            margin-right: 5px;
        }
        .contact-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ภูเวียงแกรนด์โฮเต็ล</h1>
        <p>ระบบบันทึกและจัดการข้อมูลการจองห้องพัก</p>
    </header>

    <!-- Dashboard สรุปข้อมูล -->
    <div class="dashboard">
        <div class="card success">
            <h3>สถานะห้องพักรวม</h3>
            <div class="value" id="roomStatusSummary">ห้องว่าง</div>
        </div>
        <div class="card">
            <h3>จำนวนการจองทั้งหมด</h3>
            <div class="value" id="totalBookings">0 รายการ</div>
        </div>
        <div class="card warning">
            <h3>ยอดเงินมัดจำรวม</h3>
            <div class="value" id="totalDeposit">฿0</div>
        </div>
        <div class="card danger">
            <h3>ยอดเงินค้างชำระรวม</h3>
            <div class="value" id="totalBalance">฿0</div>
        </div>
    </div>

    <div class="main-grid">
        <!-- ฟอร์มกรอกข้อมูลการจอง -->
        <div class="panel">
            <h2 id="formTitle">เพิ่มข้อมูลการจอง</h2>
            <form id="bookingForm">
                <input type="hidden" id="editId" value="">
                
                <!-- วันที่เช็คอิน: วัน เดือน ปี -->
                <div class="form-group">
                    <label>วันที่เช็คอิน (เริ่ม) [ วัน / เดือน / ปี ]</label>
                    <div class="date-select-group">
                        <select id="inDay" class="form-control" required></select>
                        <select id="inMonth" class="form-control" required></select>
                        <select id="inYear" class="form-control" required></select>
                    </div>
                </div>

                <!-- วันที่เช็คเอาท์: วัน เดือน ปี -->
                <div class="form-group">
                    <label>วันที่เช็คเอาท์ (สิ้นสุด) [ วัน / เดือน / ปี ]</label>
                    <div class="date-select-group">
                        <select id="outDay" class="form-control" required></select>
                        <select id="outMonth" class="form-control" required></select>
                        <select id="outYear" class="form-control" required></select>
                    </div>
                </div>

                <div class="row-group">
                    <div class="form-group">
                        <label>จำนวนวันที่เข้าพัก (คืน)</label>
                        <input type="number" id="stayDays" class="form-control" min="1" value="1" readonly style="background-color: #f1f5f9;">
                    </div>
                    <div class="form-group">
                        <label>สถานะห้อง</label>
                        <select id="roomAvailability" class="form-control">
                            <option value="ห้องว่าง">ห้องว่าง</option>
                            <option value="ห้องเต็ม">ห้องเต็ม</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>ชื่อผู้จองห้องพัก</label>
                    <input type="text" id="customerName" class="form-control" placeholder="ระบุชื่อ-นามสกุล" required>
                </div>
                <div class="row-group">
                    <div class="form-group">
                        <label>เบอร์โทรศัพท์ (ไม่บังคับ)</label>
                        <input type="tel" id="phone" class="form-control" placeholder="08x-xxx-xxxx">
                    </div>
                    <div class="form-group">
                        <label>Line ID / เบอร์ Line (ไม่บังคับ)</label>
                        <input type="text" id="lineId" class="form-control" placeholder="Line ID หรือเบอร์">
                    </div>
                </div>
                <div class="row-group">
                    <div class="form-group">
                        <label>เตียงเดี่ยว (ห้อง)</label>
                        <input type="number" id="singleBed" class="form-control" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label>เตียงคู่ (ห้อง)</label>
                        <input type="number" id="doubleBed" class="form-control" min="0" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>หมายเลขห้องพัก</label>
                    <input type="text" id="roomNumber" class="form-control" placeholder="เช่น 101, 202 หรือ โซน A" required>
                </div>
                
                <div class="row-group">
                    <div class="form-group">
                        <label>เงินมัดจำ (บาท)</label>
                        <input type="number" id="deposit" class="form-control" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label>ค้างชำระ (บาท)</label>
                        <input type="number" id="balance" class="form-control" min="0" value="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>สถานะการชำระเงิน</label>
                    <select id="paymentStatus" class="form-control">
                        <option value="ยังไม่ชำระ">ยังไม่ชำระ</option>
                        <option value="ชำระมัดจำแล้ว">ชำระมัดจำแล้ว</option>
                        <option value="ชำระครบแล้ว">ชำระครบแล้ว</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>หมายเหตุ (ที่นอนเสริม / สิ่งอำนวยความสะดวก)</label>
                    <textarea id="note" class="form-control" rows="2" placeholder="เช่น ขอที่นอนเสริม 1 ชุด, ขอชั้นสูง"></textarea>
                </div>
                
                <button type="submit" id="submitBtn" class="btn">บันทึกข้อมูลการจอง</button>
                <button type="button" id="cancelBtn" class="btn btn-cancel" onclick="resetForm()">ยกเลิกการแก้ไข</button>
            </form>
        </div>

        <!-- ตารางแสดงรายการจอง -->
        <div class="panel">
            <h2>รายการจองห้องพักทั้งหมด</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ช่วงวันที่เข้าพัก</th>
                            <th>ห้อง / ผู้จอง</th>
                            <th>ประเภทห้อง</th>
                            <th>การเงิน / สถานะชำระ</th>
                            <th>สถานะห้อง</th>
                            <th>หมายเหตุ</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTableBody">
                        <!-- ข้อมูลจะถูกเพิ่มเข้ามาตรงนี้ด้วย JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let bookings = [];

    // โหลดข้อมูลจาก LocalStorage เมื่อเปิดเว็บ
    function loadBookings() {
        const savedData = localStorage.getItem('phuwiang_bookings');
        if (savedData) {
            try {
                bookings = JSON.parse(savedData);
            } catch (e) {
                bookings = [];
            }
        }
    }

    // บันทึกข้อมูลลง LocalStorage ทุกครั้งที่มีการเปลี่ยนแปลง
    function saveBookings() {
        localStorage.setItem('phuwiang_bookings', JSON.stringify(bookings));
    }

    const monthsData = [
        "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
        "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
    ];

    const shortMonths = [
        "ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.",
        "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."
    ];

    function initDateSelects(inDate = null, outDate = null) {
        const today = new Date();
        const inD = inDate ? new Date(inDate) : today;
        const outD = outDate ? new Date(outDate) : new Date(today.getTime() + 86400000);

        fillSelect('inDay', 1, 31, inD.getDate());
        fillSelectMonth('inMonth', inD.getMonth());
        fillSelectYear('inYear', inD.getFullYear());

        fillSelect('outDay', 1, 31, outD.getDate());
        fillSelectMonth('outMonth', outD.getMonth());
        fillSelectYear('outYear', outD.getFullYear());

        updateStayDays();
    }

    function fillSelect(id, start, valEnd, selectedVal) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        for (let i = start; i <= valEnd; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.text = i;
            if (i === selectedVal) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function fillSelectMonth(id, selectedMonth) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        monthsData.forEach((m, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.text = m;
            if (index === selectedMonth) opt.selected = true;
            select.appendChild(opt);
        });
    }

    function fillSelectYear(id, selectedYear) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        for (let y = selectedYear - 1; y <= selectedYear + 5; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.text = y + 543;
            if (y === selectedYear) opt.selected = true;
            select.appendChild(opt);
        }
    }

    document.querySelectorAll('#inDay, #inMonth, #inYear, #outDay, #outMonth, #outYear').forEach(el => {
        el.addEventListener('change', updateStayDays);
    });

    function getSelectedDate(prefix) {
        const d = parseInt(document.getElementById(prefix + 'Day').value);
        const m = parseInt(document.getElementById(prefix + 'Month').value);
        const y = parseInt(document.getElementById(prefix + 'Year').value);
        return new Date(y, m, d);
    }

    function updateStayDays() {
        const checkIn = getSelectedDate('in');
        const checkOut = getSelectedDate('out');

        if (checkOut > checkIn) {
            const diffTime = Math.abs(checkOut - checkIn);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('stayDays').value = diffDays;
        } else {
            document.getElementById('stayDays').value = 1;
        }
    }

    function formatBookingRange(inDateObj, outDateObj) {
        const inDay = inDateObj.getDate();
        const outDay = outDateObj.getDate();
        const inMonth = shortMonths[inDateObj.getMonth()];
        const outMonth = shortMonths[outDateObj.getMonth()];
        const inYear = inDateObj.getFullYear() + 543;
        const outYear = outDateObj.getFullYear() + 543;

        if (inDateObj.getMonth() === outDateObj.getMonth() && inDateObj.getFullYear() === outDateObj.getFullYear()) {
            return `${inDay} - ${outDay} ${inMonth} ${inYear}`;
        } else {
            return `${inDay} ${inMonth} ${inYear} ถึง ${outDay} ${outMonth} ${outYear}`;
        }
    }

    const bookingForm = document.getElementById('bookingForm');
    const bookingTableBody = document.getElementById('bookingTableBody');

    bookingForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const checkIn = getSelectedDate('in');
        const checkOut = getSelectedDate('out');

        if (checkOut <= checkIn) {
            alert('วันที่เช็คเอาท์ต้องมากกว่าวันที่เช็คอินเสมอ');
            return;
        }

        const editId = document.getElementById('editId').value;
        const deposit = parseFloat(document.getElementById('deposit').value) || 0;
        const balance = parseFloat(document.getElementById('balance').value) || 0;
        const paymentStatus = document.getElementById('paymentStatus').value;
        const phone = document.getElementById('phone').value.trim();
        const lineId = document.getElementById('lineId').value.trim();

        if (editId) {
            bookings = bookings.map(b => {
                if (b.id == editId) {
                    return {
                        ...b,
                        checkIn: checkIn,
                        checkOut: checkOut,
                        stayDays: document.getElementById('stayDays').value,
                        roomNumber: document.getElementById('roomNumber').value,
                        availability: document.getElementById('roomAvailability').value,
                        name: document.getElementById('customerName').value,
                        phone: phone,
                        lineId: lineId,
                        singleBed: parseInt(document.getElementById('singleBed').value) || 0,
                        doubleBed: parseInt(document.getElementById('doubleBed').value) || 0,
                        deposit: deposit,
                        balance: balance,
                        paymentStatus: paymentStatus,
                        note: document.getElementById('note').value || '-'
                    };
                }
                return b;
            });
        } else {
            const newBooking = {
                id: Date.now(),
                checkIn: checkIn,
                checkOut: checkOut,
                stayDays: document.getElementById('stayDays').value,
                roomNumber: document.getElementById('roomNumber').value,
                availability: document.getElementById('roomAvailability').value,
                name: document.getElementById('customerName').value,
                phone: phone,
                lineId: lineId,
                singleBed: parseInt(document.getElementById('singleBed').value) || 0,
                doubleBed: parseInt(document.getElementById('doubleBed').value) || 0,
                deposit: deposit,
                balance: balance,
                paymentStatus: paymentStatus,
                note: document.getElementById('note').value || '-'
            };
            bookings.push(newBooking);
        }

        saveBookings();
        renderTable();
        resetForm();
    });

    function editBooking(id) {
        const b = bookings.find(item => item.id === id);
        if (!b) return;

        document.getElementById('editId').value = b.id;
        initDateSelects(b.checkIn, b.checkOut);
        document.getElementById('stayDays').value = b.stayDays;
        document.getElementById('roomAvailability').value = b.availability;
        document.getElementById('customerName').value = b.name;
        document.getElementById('phone').value = b.phone;
        document.getElementById('lineId').value = b.lineId;
        document.getElementById('singleBed').value = b.singleBed;
        document.getElementById('doubleBed').value = b.doubleBed;
        document.getElementById('roomNumber').value = b.roomNumber;
        document.getElementById('deposit').value = b.deposit;
        document.getElementById('balance').value = b.balance;
        document.getElementById('paymentStatus').value = b.paymentStatus;
        document.getElementById('note').value = b.note === '-' ? '' : b.note;

        document.getElementById('formTitle').innerText = 'แก้ไขข้อมูลการจอง';
        document.getElementById('submitBtn').innerText = 'บันทึกการแก้ไข';
        document.getElementById('cancelBtn').style.display = 'block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        bookingForm.reset();
        document.getElementById('editId').value = '';
        document.getElementById('formTitle').innerText = 'เพิ่มข้อมูลการจอง';
        document.getElementById('submitBtn').innerText = 'บันทึกข้อมูลการจอง';
        document.getElementById('cancelBtn').style.display = 'none';
        initDateSelects();
    }

    function deleteBooking(id) {
        if (confirm('คุณต้องการลบรายการจองนี้ใช่หรือไม่?')) {
            bookings = bookings.filter(b => b.id !== id);
            saveBookings();
            renderTable();
        }
    }

    function renderTable() {
        bookingTableBody.innerHTML = '';
        let totalDep = 0;
        let totalBal = 0;
        let hasFull = false;

        if (bookings.length === 0) {
            bookingTableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b; padding: 20px;">ยังไม่มีข้อมูลการจอง</td></tr>`;
        }

        bookings.forEach(b => {
            totalDep += b.deposit;
            totalBal += b.balance;
            if (b.availability === 'ห้องเต็ม') hasFull = true;

            const badgeClass = b.availability === 'ห้องว่าง' ? 'available' : 'full';
            const dateRangeText = formatBookingRange(new Date(b.checkIn), new Date(b.checkOut));
            
            let payBadge = '';
            if (b.paymentStatus === 'ชำระครบแล้ว') {
                payBadge = '<span class="badge paid">ชำระครบแล้ว</span>';
            } else if (b.paymentStatus === 'ชำระมัดจำแล้ว') {
                payBadge = '<span class="badge deposit">ชำระมัดจำแล้ว</span>';
            } else {
                payBadge = '<span class="badge unpaid">ยังไม่ชำระ</span>';
            }

            let contactHtml = '';
            if (b.phone) {
                contactHtml += `<a href="tel:${b.phone}" class="contact-link" title="โทรออก">📞 ${b.phone}</a><br>`;
            }
            if (b.lineId) {
                contactHtml += `<a href="https://line.me/ti/p/~${encodeURIComponent(b.lineId)}" target="_blank" class="contact-link" title="เพิ่มเพื่อนทางไลน์">💚 ${b.lineId}</a>`;
            }
            if (!b.phone && !b.lineId) {
                contactHtml = '<span style="color:#94a3b8;">- ไม่ได้ระบุ -</span>';
            }
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${dateRangeText}</strong><br><span style="color:#64748b; font-size:11px;">(${b.stayDays} คืน)</span></td>
                <td><strong style="color:var(--primary);">ห้อง: ${b.roomNumber}</strong><br>${b.name}<br><div style="font-size:11px; margin-top:2px;">${contactHtml}</div></td>
                <td>เดี่ยว: ${b.singleBed}<br>คู่: ${b.doubleBed}</td>
                <td>มัดจำ: ฿${b.deposit.toLocaleString()}<br>ค้างชำระ: <span style="color:#ef4444;">฿${b.balance.toLocaleString()}</span><br>${payBadge}</td>
                <td><span class="badge ${badgeClass}">${b.availability}</span></td>
                <td><small>${b.note}</small></td>
                <td>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editBooking(${b.id})">แก้ไข</button>
                        <button class="delete-btn" onclick="deleteBooking(${b.id})">ลบ</button>
                    </div>
                </td>
            `;
            bookingTableBody.appendChild(row);
        });

        document.getElementById('totalBookings').innerText = bookings.length + ' รายการ';
        document.getElementById('totalDeposit').innerText = '฿' + totalDep.toLocaleString();
        document.getElementById('totalBalance').innerText = '฿' + totalBal.toLocaleString();
        
        const statusEl = document.getElementById('roomStatusSummary');
        if (hasFull && bookings.length > 0) {
            statusEl.innerText = 'มีบางส่วนเต็ม';
        } else {
            statusEl.innerText = 'ห้องว่างปกติ';
        }
    }

    // โหลดข้อมูลและแสดงผลเมื่อเปิดเว็บ
    loadBookings();
    initDateSelects();
    renderTable();
</script>

</body>
</html>
